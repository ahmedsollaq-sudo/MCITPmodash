<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCIT PMO Dashboard</title><link rel="stylesheet" href="styles.css?v=21"></head><body>
<header><div class="brand"><b>M</b><div><strong>MCIT</strong><small id="brandTitle">PMO Dashboard</small></div></div><div class="header-actions"><button id="langBtn">العربية</button><span class="avatar">PM</span></div></header>
<main><section class="heading"><div><small class="eyebrow" data-i="title">PMO Dashboard</small><h1 data-i="tab">Major Sector Projects</h1><p data-i="overview">Portfolio overview</p></div></section>
<nav><button class="active"><span data-i="tab">Major Sector Projects</span> <em id="navCount">0</em></button><button disabled data-i="strategic">Strategic initiatives</button><button disabled data-i="operational">Operational projects</button></nav>
<section class="metrics"><article><i class="blue">▦</i><div><span data-i="total">Total projects</span><strong id="total">0</strong></div></article><article><i class="green">◔</i><div><span data-i="avg">Average completion</span><strong id="average">0%</strong></div></article><article><i class="amber">△</i><div><span data-i="risks">Projects with risks</span><strong id="riskCount">0</strong></div></article></section>
<section class="register"><div class="toolbar"><div class="search">⌕ <input id="search" data-ph="search" placeholder="Search by project, code or department…"></div><select id="department"><option value="all" data-i="all">All departments</option></select><button class="primary toolbar-add" id="addBtn">＋ <span data-i="add">Add project</span></button></div><div id="projects" class="project-list"></div></section></main>
<div class="overlay hidden" id="overlay"><form id="projectForm"><div class="modal-head"><div><small id="formMode">Add new project</small><h2 data-i="tab">Major Sector Projects</h2></div><button type="button" id="closeBtn">×</button></div><div class="form-grid"><label><span data-i="code">Project code</span><input name="projectCode" required></label><label><span data-i="deptCode">Department code</span><input name="departmentCode" required></label><fieldset><legend>English content</legend><label>Project name<input name="projectNameEn" required></label><label>Department name<input name="departmentNameEn" required></label><label>Achievements<textarea name="achievementsEn"></textarea></label><label>Next steps<textarea name="nextStepsEn"></textarea></label><label>Challenges & risks<textarea name="challengesRisksEn"></textarea></label><label>Support needed<textarea name="supportNeededEn"></textarea></label></fieldset><fieldset dir="rtl"><legend>المحتوى العربي</legend><label>اسم المشروع<input name="projectNameAr" required></label><label>اسم الإدارة<input name="departmentNameAr" required></label><label>الإنجازات<textarea name="achievementsAr"></textarea></label><label>الخطوات القادمة<textarea name="nextStepsAr"></textarea></label><label>التحديات والمخاطر<textarea name="challengesRisksAr"></textarea></label><label>الدعم المطلوب<textarea name="supportNeededAr"></textarea></label></fieldset><div class="wide rate-form-grid"><label class="rate-field"><span data-i="actualCompletion">Actual completion</span>: <strong id="actualCompletionValue">0%</strong><input type="range" name="actualCompletionRate" min="0" max="100" value="0"></label><label class="rate-field"><span data-i="plannedCompletion">Planned completion</span>: <strong id="plannedCompletionValue">0%</strong><input type="range" name="plannedCompletionRate" min="0" max="100" value="0"></label><label class="rate-field"><span data-i="actualImplementation">Actual implementation</span>: <strong id="actualImplementationValue">0%</strong><input type="range" name="actualImplementationRate" min="0" max="100" value="0"></label><label class="rate-field"><span data-i="plannedImplementation">Planned implementation</span>: <strong id="plannedImplementationValue">0%</strong><input type="range" name="plannedImplementationRate" min="0" max="100" value="0"></label><label class="rate-field"><span data-i="actualOperation">Actual operation</span>: <strong id="actualOperationValue">0%</strong><input type="range" name="actualOperationRate" min="0" max="100" value="0"></label><label class="rate-field"><span data-i="plannedOperation">Planned operation</span>: <strong id="plannedOperationValue">0%</strong><input type="range" name="plannedOperationRate" min="0" max="100" value="0"></label></div></div><div class="modal-actions"><button type="button" id="cancelBtn" data-i="cancel">Cancel</button><button class="primary" data-i="save">Save project</button></div></form></div><div class="overlay hidden" id="deleteOverlay"><section class="confirm-dialog" role="alertdialog" aria-modal="true"><div class="confirm-symbol">!</div><div><h2>Delete Confirmation</h2><p>Are you sure you want delete this project?</p></div><div class="confirm-actions"><button id="deleteCancel">Cancel</button><button class="delete-confirm" id="deleteConfirm">Delete</button></div></section></div><script src="app.js?v=21"></script></body></html>
