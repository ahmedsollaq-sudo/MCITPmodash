<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project History — MCIT PMO</title><link rel="stylesheet" href="styles.css?v=26"></head><body><header><div class="brand"><b>M</b><div><strong>MCIT</strong><small id="brandTitle">PMO Dashboard</small></div></div><div class="header-actions"><button id="langBtn">العربية</button></div></header><main class="history-page"><div class="history-heading"><small id="historyTitle">Project history log</small><h1 id="projectCode"></h1></div><form id="historyForm" class="history-form"><h2 id="newLogTitle">Add history record</h2><label><span id="logTextLabel">Log text</span><textarea name="logText" required></textarea></label><label><span id="userLabel">User</span><input name="user" required></label><button class="primary" id="saveLog">Save record</button><p id="historyError" class="history-error"></p></form><section class="history-search"><label><span id="historySearchLabel">Search log text or user</span><input type="search" id="historySearch" placeholder="Enter text or user name…"></label><label><span id="historyDateLabel">Record date</span><input type="date" id="historyDate"></label><button id="historyClear" type="button">Clear</button></section><section id="historyList" class="history-list"></section></main><div class="overlay hidden" id="historyDeleteOverlay"><section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="historyDeleteTitle"><div class="confirm-symbol">!</div><div><h2 id="historyDeleteTitle">Delete Confirmation</h2><p id="historyDeleteMessage">Are you sure you want to delete this entry?</p></div><div class="confirm-actions"><button id="historyDeleteCancel">Cancel</button><button class="delete-confirm" id="historyDeleteConfirm">Delete</button></div></section></div><script src="history.js?v=26"></script></body></html>
